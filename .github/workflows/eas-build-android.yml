name: Build Android APK (EAS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtual-fridge-app/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: virtual-fridge-app/mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS project ID
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.extra = app.expo.extra ?? {};
          app.expo.extra.eas = { projectId: process.env.EXPO_PROJECT_ID };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          EOF

      - name: Build Android preview APK
        run: eas build --platform android --profile preview --non-interactive
